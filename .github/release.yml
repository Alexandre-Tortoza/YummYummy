changelog:
  exclude:
    labels:
      - skip-changelog

  categories:
    - title: Features
      labels:
        - "type: feature"
        - "type: enhancement"

    - title: Fixes
      labels:
        - "type: bug"

    - title: Dependencies
      labels:
        - dependencies

    - title: Maintenance
      labels:
        - "type: chore"
        - "type: docs"
        - "type: test"

    - title: Other changes
      labels:
        - "*"
