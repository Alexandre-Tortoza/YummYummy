name: Bug report
description: Report unexpected behavior in YummYummy
title: "[Bug] "
labels:
  - "type: bug"
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Perform ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, browser, OS, or other relevant details.
